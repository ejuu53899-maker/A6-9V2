name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, 'JULES_API_KEY_V4*']
  pull_request:
    branches: [main, master, develop, 'JULES_API_KEY_V4*']

env:






jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cleanup orphaned gitlinks
        run: |
          # Remove 160000 entries that are not in .gitmodules to avoid checkout errors in CI
          git ls-files -s | grep ^160000 | awk '{print $4}' | while read path; do
            if ! grep -q "path = $path" .gitmodules; then
              echo "Removing orphaned gitlink: $path"
              git rm --cached "$path" || true
            fi
          done





  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4











  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4











  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to development
        run: |
          echo "Deploying to development environment..."
          # Add your deployment commands here
          # Example: scp, rsync, kubectl, terraform, etc.

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: scp, rsync, kubectl, terraform, etc.

  push-to-performance:
    name: Push to Performance Repo
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/JULES_API_KEY_V4')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Performance Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_PUSH }}
        run: |
          git remote add performance https://x-access-token:${GITHUB_TOKEN}@github.com/meizhuxie4-spec/PERFORMANCE.git
          git push performance HEAD:main --force

  push-to-codeberg:
    name: Push to Codeberg Repo
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/JULES_API_KEY_V4')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg Repository
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_API_KEY }}
        run: |
          git remote add codeberg https://x-access-token:${CODEBERG_TOKEN}@codeberg.org/LengKundee/forgejo.git
          git push codeberg HEAD:main --force
