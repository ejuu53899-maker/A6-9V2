name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  # These should be set in GitHub Repository Secrets
  JULES_API_KEY_V4: ${{ secrets.JULES_API_KEY_V4 }}
  GITHUB_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN_PUSH }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          python -m flake8 GenX_FX_V4/bridge.py

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f GenX_FX_V4/requirements.txt ]; then pip install -r GenX_FX_V4/requirements.txt; fi

      - name: Run unit tests
        run: |
          python3 -m unittest discover GenX_FX_V4/tests

  build-and-scan:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t genx-bridge:${{ github.sha }} ./GenX_FX_V4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'genx-bridge:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development (Simulated)
        run: |
          echo "Logging into Container Registry..."
          # docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}

          echo "Pushing image to registry..."
          # docker tag genx-bridge:${{ github.sha }} my-registry.com/genx-bridge:dev
          # docker push my-registry.com/genx-bridge:dev

          echo "Updating service in development..."
          # kubectl set image deployment/genx-bridge bridge=my-registry.com/genx-bridge:dev

          echo "Deployment to development environment simulated successfully"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production (Simulated)
        run: |
          echo "Promoting dev image to production..."
          # docker tag my-registry.com/genx-bridge:dev my-registry.com/genx-bridge:prod
          # docker push my-registry.com/genx-bridge:prod

          echo "Updating service in production..."
          # kubectl set image deployment/genx-bridge bridge=my-registry.com/genx-bridge:prod

          echo "Production deployment simulated successfully"
