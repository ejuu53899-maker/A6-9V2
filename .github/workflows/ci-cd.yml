name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 GenX_FX_V4/bridge.py --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Syntax Check
        run: |
          python3 -m py_compile GenX_FX_V4/bridge.py

      - name: Run Integration Test (Mock)
        run: |
          export JULES_API_KEY_V4="TEST_KEY"
          export GITHUB_TOKEN_PUSH="TEST_TOKEN"
          python3 GenX_FX_V4/bridge.py &
          BRIDGE_PID=$!
          sleep 5
          curl -s http://localhost:8000/remote/status | grep "START"
          kill $BRIDGE_PID

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Artifacts
        run: |
          mkdir -p dist/GenX_FX_V4
          cp GenX_FX_V4/GenX_EA_V4.mq5 dist/GenX_FX_V4/
          cp GenX_FX_V4/bridge.py dist/GenX_FX_V4/
          cp GenX_FX_V4/startup.sh dist/GenX_FX_V4/
          cp GenX_FX_V4/requirements.txt dist/GenX_FX_V4/
          cp README.md dist/
          tar -czf genx-fx-v4.tar.gz -C dist .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genx-fx-v4-build
          path: genx-fx-v4.tar.gz

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: genx-fx-v4-build

      - name: Deploy to development
        run: |
          echo "Deploying GenX FX V4 to development environment..."
          tar -xzf genx-fx-v4.tar.gz
          ls -R

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: genx-fx-v4-build

      - name: Deploy to production
        run: |
          echo "Deploying GenX FX V4 to production environment..."
          tar -xzf genx-fx-v4.tar.gz
          ls -R
