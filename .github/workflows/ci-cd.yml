name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go Bridge
        run: |
          cd GenX_Go_Bridge
          go build -o genx_bridge main.go

      - name: Build Forgejo (if modified)
        run: |
          if [ -d "forgejo_setup" ]; then
            cd forgejo_setup
            make build
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            GenX_Go_Bridge/genx_bridge
            forgejo_setup/gitea

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Go Bridge Image
        uses: docker/build-push-action@v5
        with:
          context: ./GenX_Go_Bridge
          push: true
          tags: ghcr.io/${{ github.repository }}/genx-go-bridge:latest

      - name: Build and Push Python Bridge Image
        uses: docker/build-push-action@v5
        with:
          context: ./GenX_FX_V4
          push: true
          tags: ghcr.io/${{ github.repository }}/genx-py-bridge:latest

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

  deploy-ring-0:
    name: Deploy to Ring 0 (Development)
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: ring-0-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to Ring 0
        run: |
          echo "Deploying to Ring 0 (Internal Development)..."

  deploy-ring-1:
    name: Deploy to Ring 1 (Staging)
    runs-on: ubuntu-latest
    needs: deploy-ring-0
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: ring-1-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to Ring 1
        run: |
          echo "Deploying to Ring 1 (Staging/Beta)..."

  deploy-ring-2:
    name: Deploy to Ring 2 (Production)
    runs-on: ubuntu-latest
    needs: deploy-ring-1
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: ring-2-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to Ring 2
        run: |
          echo "Deploying to Ring 2 (Global Production)..."
