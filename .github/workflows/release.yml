name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version || github.ref }}
          release_name: Release ${{ github.event.inputs.version || github.ref }}
          body: |
            Release ${{ github.event.inputs.version || github.ref }}
            
            See CHANGELOG.md for details.
          draft: false
          prerelease: false

      - name: Go Release Binaries
        uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: linux,windows,darwin
          goarch: amd64,arm64
          project_path: "./GenX_Go_Bridge"
          binary_name: "genx_bridge"
          extra_files: LICENSE README.md
