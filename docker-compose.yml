version: '3.8'

services:
  forgejo:
    image: code.forgejo.org/forgejo/forgejo:1.21
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    volumes:
      - ./forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
      - "2222:22"
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  bridge:
    build:
      context: ./GenX_Go_Bridge
      dockerfile: Dockerfile
    container_name: genx_bridge
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - forgejo
