name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: mouyleng/genx-fx

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          MT5_ACCOUNT_ID: ${{ secrets.MT5_ACCOUNT_ID }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          LOGIN_LIVE_NUMBER: ${{ secrets.LOGIN_LIVE_NUMBER }}
          LOGIN_DEMO_NUMBER: ${{ secrets.LOGIN_DEMO_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_HANDLE: ${{ secrets.TELEGRAM_BOT_HANDLE }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET_KEY: ${{ secrets.BYBIT_SECRET_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          AMP_TOKEN: ${{ secrets.AMP_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MQL5_LOGIN: ${{ secrets.MQL5_LOGIN }}
          MQL5_PASSWORD: ${{ secrets.MQL5_PASSWORD }}
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: MT5_ACCOUNT_ID,MT5_SERVER,MT5_PASSWORD,LOGIN_LIVE_NUMBER,LOGIN_DEMO_NUMBER,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_HANDLE,BYBIT_API_KEY,BYBIT_SECRET_KEY,OKX_API_KEY,OKX_SECRET_KEY,AMP_TOKEN,JULES_API_KEY,GEMINI_API_KEY,MQL5_LOGIN,MQL5_PASSWORD,BRIDGE_API_KEY
          script: |
            # Navigate to project directory
            cd /opt/genx-fx || mkdir -p /opt/genx-fx && cd /opt/genx-fx

            # Pull latest code if repo exists, otherwise clone
            if [ -d ".git" ]; then
              git fetch origin main && git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Create .env file dynamically from GitHub Secrets mapped in envs
            echo "Creating .env file for VPS runtime..."
            cat << EOT > .env
            MT5_ACCOUNT_ID=$MT5_ACCOUNT_ID
            MT5_SERVER=$MT5_SERVER
            MT5_PASSWORD=$MT5_PASSWORD
            LOGIN_LIVE_NUMBER=$LOGIN_LIVE_NUMBER
            LOGIN_DEMO_NUMBER=$LOGIN_DEMO_NUMBER
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
            TELEGRAM_BOT_HANDLE=$TELEGRAM_BOT_HANDLE
            BYBIT_API_KEY=$BYBIT_API_KEY
            BYBIT_SECRET_KEY=$BYBIT_SECRET_KEY
            OKX_API_KEY=$OKX_API_KEY
            OKX_SECRET_KEY=$OKX_SECRET_KEY
            AMP_TOKEN=$AMP_TOKEN
            JULES_API_KEY=$JULES_API_KEY
            GEMINI_API_KEY=$GEMINI_API_KEY
            MQL5_LOGIN=$MQL5_LOGIN
            MQL5_PASSWORD=$MQL5_PASSWORD
            BRIDGE_API_KEY=$BRIDGE_API_KEY
            EOT

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # Pull latest images
            docker-compose -f docker-compose.production.yml pull

            # Stop existing containers
            docker-compose -f docker-compose.production.yml down

            # Start updated containers
            docker-compose -f docker-compose.production.yml up -d

            # Clean up old images
            docker system prune -af --filter "until=24h"

            # Check service status
            docker-compose -f docker-compose.production.yml ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Wait for services to start
            sleep 10

            # Check API health
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ API health check passed"
            else
              echo "❌ API health check failed"
              exit 1
            fi

            # Check running containers
            docker-compose -f /opt/genx-fx/docker-compose.production.yml ps

      - name: Send deployment notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deployment Status: ${{ job.status }}

            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Author: ${{ github.actor }}
            💬 Commit: ${{ github.event.head_commit.message }}
            🔗 Commit URL: ${{ github.event.head_commit.url }}

            🕐 Time: ${{ github.event.head_commit.timestamp }}
            🖥️ VPS: ${{ secrets.VPS_HOST }}

  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: success()

    steps:
      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Create backup directory
            mkdir -p /opt/genx-fx/backups

            # Backup PostgreSQL
            docker exec genx-postgres pg_dump -U genx_user genx_trading > /opt/genx-fx/backups/postgres_$(date +%Y%m%d_%H%M%S).sql

            # Keep only last 7 days of backups
            find /opt/genx-fx/backups -name "postgres_*.sql" -mtime +7 -delete

            echo "✅ Database backup completed"
